<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calorie Journal</title>
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#26202f;--mute:#74697f;--line:#e4dcf0;--accent:#7c3aed;--accent-ink:#fff;--tint:#f0e9fc;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131d;--card:#211b2b;--ink:#f0eaf7;--mute:#a99bbb;--line:#382e47;--accent:#a78bfa;--accent-ink:#17131d;--tint:#2b2238;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17131d;--card:#211b2b;--ink:#f0eaf7;--mute:#a99bbb;--line:#382e47;--accent:#a78bfa;--accent-ink:#17131d;--tint:#2b2238;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font:600 1.7rem Georgia,"Times New Roman",serif;margin:0}
h2{font-size:1.05rem;margin:0 0 12px}
.sub{color:var(--mute);font-size:.9rem}
.app{display:flex;gap:20px;max-width:1120px;margin:0 auto;padding:20px 16px 40px;align-items:flex-start}
.side{width:210px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:16px}
.brand{font:600 1.2rem Georgia,"Times New Roman",serif;color:var(--accent);margin:4px 6px 14px}
.side button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:10px 12px;margin-bottom:4px;font-weight:500}
.side button:hover{background:var(--tint)}
.side button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
main{flex:1;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:none;border:none;color:var(--mute);padding:4px 8px}
button.ghost:hover{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input[type=text]{flex:1;min-width:120px}
.row>input[type=number]{width:100px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 8px;align-items:flex-end}
.stats div{font-size:.85rem;color:var(--mute)}
.stats b{display:block;font-size:1.3rem;color:var(--ink)}
.mood{display:flex;align-items:center;justify-content:center;width:56px;height:40px;font-size:1.6rem;border:1px solid var(--line);border-radius:9px;background:var(--tint);user-select:none;margin-bottom:2px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.slotrow{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:10px;margin-bottom:10px}
.tbox{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.tbox small{display:block;color:var(--mute);font-weight:500}
.tbox input{width:100%;margin-bottom:6px}
.tbox input[type=text]{font-weight:600}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.food{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.addfood{display:flex;gap:8px;margin-top:6px}
.addfood input{flex:1;min-width:0}
.mhead{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:.85rem;margin-bottom:4px}
.meal{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.meal span{color:var(--mute);font-size:.9rem}
.none{color:var(--mute);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pie{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
#pie{flex:0 1 260px}
.pie svg{width:100%;max-width:260px;height:auto}
.legend{flex:1;min-width:220px;font-size:.92rem}
.legend div{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span:nth-child(3){margin-left:auto;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:24px 0}
@media(max-width:760px){
  .app{flex-direction:column;gap:14px}
  .side{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .brand{width:100%;margin:0 0 4px}
  .side button{flex:1;text-align:center;margin:0;padding:8px 6px;font-size:.85rem}
  .slotrow{grid-template-columns:minmax(96px,120px) 1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Features">
    <div class="brand">Calorie Journal</div>
    <button data-v="planner">Meal Planner</button>
    <button data-v="tracker">Meal Tracker</button>
    <button data-v="summary">Calories Summary</button>
  </nav>

  <main>
    <div class="top">
      <div><h1 id="title"></h1><div class="sub" id="dateLabel"></div></div>
      <div class="row" id="dateCtl">
        <button id="prev" aria-label="Previous day">‹</button>
        <input type="date" id="date">
        <button id="next" aria-label="Next day">›</button>
        <button id="today">Today</button>
      </div>
    </div>

    <section id="v-tracker">
      <div class="card">
        <h2 id="dayTitle">Today’s meals</h2>
        <div class="row">
          <select id="mSlot" aria-label="Meal"></select>
          <select id="mFood" aria-label="Food"></select>
          <input type="text" id="mName" placeholder="Food name" hidden>
          <input type="number" id="mKcal" placeholder="kcal" min="0">
          <button class="primary" id="add">Add</button>
        </div>
        <div class="stats">
          <div><b id="total">0</b>eaten</div>
          <div><b id="left">0</b>remaining</div>
          <div><b><input type="number" id="goal" min="0" style="width:90px;padding:2px 6px"></b>daily goal</div>
          <div><span class="mood" id="mood" role="img" aria-label="Progress"></span>progress</div>
        </div>
        <div class="bar"><i id="barFill" style="width:0"></i></div>
        <div id="timetable"></div>
      </div>
    </section>

    <section id="v-planner" hidden>
      <div class="card">
        <h2>My meal planner</h2>
        <p class="sub" style="margin-top:0">Name your meals and set when you usually eat them. Foods you add are saved for the date shown above and appear in the Meal Tracker for that date, so you only need to enter calories.</p>
        <div id="slotEditor"></div>
        <button id="addSlot">+ Add meal</button>
      </div>
    </section>

    <section id="v-summary" hidden>
      <div class="card">
        <h2>Calories summary</h2>
        <div class="tabs" id="tabs">
          <button data-p="day" class="on">Day</button><button data-p="week">Week</button>
          <button data-p="month">Month</button><button data-p="year">Year</button>
        </div>
        <div class="sub" id="rangeLabel" style="text-align:center;margin-bottom:12px"></div>
        <div class="pie"><div id="pie"></div><div class="legend" id="legend"></div></div>
        <div class="stats" style="justify-content:center" id="pstats"></div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const COLORS = ["#7c3aed","#c084fc","#4c1d95","#d946ef","#6366f1","#a78bfa","#db2777","#0ea5e9","#64748b"];
const VIEWS = { tracker: "Meal Tracker", planner: "Meal Planner", summary: "Calories Summary" };
let S = {
  slots: [{id:1,name:"Breakfast",time:"08:00"},{id:2,name:"Lunch",time:"12:30"},{id:3,name:"Snack",time:"16:00"},{id:4,name:"Dinner",time:"19:00"}],
  meals: [], byDate: {}, goal: 2000, nid: 10
};
try { const r = localStorage.getItem("calorie-journal-v1"); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}

const save = () => { try { localStorage.setItem("calorie-journal-v1", JSON.stringify(S)); } catch (e) {} };

const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
let date = iso(new Date()), period = "day", view = null;
const foodsFor = id => (S.byDate[date] || {})[id] || [];
const setFoods = (id, list) => { (S.byDate[date] = S.byDate[date] || {})[id] = list; };
// One-time move of foods saved before dates existed onto today's date
S.slots.forEach(s => {
  const old = Array.isArray(s.foods) ? s.foods : (s.plan ? [s.plan] : []);
  if (old.length) setFoods(s.id, [...new Set([...foodsFor(s.id), ...old])]);
  delete s.foods; delete s.plan;
});
save();
const byTime = () => [...S.slots].sort((x, y) => x.time.localeCompare(y.time));
const sum = l => l.reduce((t, m) => t + m.kcal, 0);
const mood = p => p >= 100 ? "😊" : p >= 75 ? "🙂" : p >= 50 ? "😐" : p >= 25 ? "😔" : "😞";
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function range() {
  const d = parse(date); let a, b;
  if (period === "day") { a = b = d; }
  else if (period === "week") { const off = (d.getDay() + 6) % 7; a = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off); b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6); }
  else if (period === "month") { a = new Date(d.getFullYear(), d.getMonth(), 1); b = new Date(d.getFullYear(), d.getMonth() + 1, 0); }
  else { a = new Date(d.getFullYear(), 0, 1); b = new Date(d.getFullYear(), 11, 31); }
  return [iso(a), iso(b), Math.round((b - a) / 864e5) + 1];
}

function renderSelect() {
  const sel = $("#mSlot"), cur = sel.value; sel.innerHTML = "";
  byTime().forEach(s => { const o = el("option", "", s.name); o.value = s.name; sel.appendChild(o); });
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  renderFoodSelect();
}

function renderFoodSelect() {
  const slot = S.slots.find(s => s.name === $("#mSlot").value), fs = $("#mFood"), cur = fs.value; fs.innerHTML = "";
  (slot ? foodsFor(slot.id) : []).forEach(f => { const o = el("option", "", f); o.value = f; fs.appendChild(o); });
  const o = el("option", "", "Other (type a name)…"); o.value = "__other"; fs.appendChild(o);
  fs.value = [...fs.options].some(x => x.value === cur) ? cur : fs.options[0].value;
  $("#mName").hidden = fs.value !== "__other";
}

function renderDay() {
  const day = S.meals.filter(m => m.date === date), total = sum(day), pct = S.goal ? total / S.goal * 100 : 0;
  $("#dateLabel").textContent = parse(date).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("#dayTitle").textContent = date === iso(new Date()) ? "Today’s meals" : "Meals on " + parse(date).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  $("#date").value = date;
  $("#total").textContent = total;
  $("#left").textContent = Math.max(0, S.goal - total);
  $("#goal").value = S.goal;
  $("#barFill").style.width = Math.min(100, pct) + "%";
  const mo = $("#mood"); mo.textContent = mood(pct);
  mo.title = mo.ariaLabel = Math.round(pct) + "% of daily goal";
  const box = $("#timetable"); box.innerHTML = "";
  const names = new Set(S.slots.map(s => s.name));
  const groups = byTime().map(s => ({ name: s.name, time: s.time, foods: foodsFor(s.id) }));
  if (day.some(m => !names.has(m.slot))) groups.push({ name: "Other" });
  groups.forEach(g => {
    const items = day.filter(m => g.name === "Other" ? !names.has(m.slot) : m.slot === g.name);
    const row = el("div", "slotrow"), t = el("div", "tbox", g.name), mb = el("div", "mbox");
    if (g.time) t.appendChild(el("small", "", g.time));
    const head = el("div", "mhead"); head.append(el("span", "", g.foods && g.foods.length ? "Planned: " + g.foods.join(", ") : ""), el("span", "", sum(items) + " kcal"));
    mb.appendChild(head);
    if (!items.length) mb.appendChild(el("div", "none", "Nothing logged yet"));
    items.forEach(m => {
      const r = el("div", "meal"), x = el("button", "ghost", "✕");
      x.setAttribute("aria-label", "Delete " + m.name);
      x.onclick = () => { S.meals = S.meals.filter(z => z.id !== m.id); save(); render(); };
      const l = el("div"); l.append(document.createTextNode(m.name + " "), el("span", "", m.kcal + " kcal"));
      r.append(l, x); mb.appendChild(r);
    });
    row.append(t, mb); box.appendChild(row);
  });
}

function renderChart() {
  const [a, b, days] = range(), list = S.meals.filter(m => m.date >= a && m.date <= b), total = sum(list);
  const fmt = s => parse(s).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  $("#rangeLabel").textContent = period === "day" ? fmt(a) : fmt(a) + " – " + fmt(b);
  const by = {}; list.forEach(m => by[m.slot] = (by[m.slot] || 0) + m.kcal);
  const data = Object.entries(by).sort((x, y) => y[1] - x[1]);
  const pie = $("#pie"), lg = $("#legend"), ps = $("#pstats"); pie.innerHTML = lg.innerHTML = ps.innerHTML = "";
  if (!total) { pie.appendChild(el("div", "empty", "No meals logged for this period.")); return; }
  const NS = "http://www.w3.org/2000/svg", mk = t => document.createElementNS(NS, t), svg = mk("svg");
  svg.setAttribute("viewBox", "-100 -100 200 200");
  const pt = (ang, r) => [r * Math.sin(ang), -r * Math.cos(ang)];
  let start = 0;
  data.forEach(([name, v], i) => {
    const col = COLORS[i % COLORS.length], frac = v / total, end = start + frac * 2 * Math.PI;
    let node;
    if (data.length === 1) { node = mk("circle"); node.setAttribute("r", 95); }
    else {
      const [x1, y1] = pt(start, 95), [x2, y2] = pt(end, 95);
      node = mk("path"); node.setAttribute("d", `M0 0L${x1} ${y1}A95 95 0 ${frac > .5 ? 1 : 0} 1 ${x2} ${y2}Z`);
    }
    node.style.fill = col; node.style.stroke = "var(--card)"; node.setAttribute("stroke-width", 2);
    const t = mk("title"); t.textContent = `${name}: ${v} kcal`; node.appendChild(t);
    svg.appendChild(node); start = end;
    const row = el("div"), sw = el("i"); sw.style.background = col;
    row.append(sw, el("span", "", name), el("span", "", `${v} kcal · ${Math.round(frac * 100)}%`)); lg.appendChild(row);
  });
  const hole = mk("circle"); hole.setAttribute("r", 52); hole.style.fill = "var(--card)";
  const t1 = mk("text"), t2 = mk("text");
  [t1, t2].forEach(t => { t.setAttribute("text-anchor", "middle"); t.style.fill = "var(--ink)"; });
  t1.setAttribute("y", 4); t1.setAttribute("font-size", 22); t1.setAttribute("font-weight", 700); t1.textContent = total;
  t2.setAttribute("y", 22); t2.setAttribute("font-size", 11); t2.textContent = "kcal";
  svg.append(hole, t1, t2); pie.appendChild(svg);
  const dayCount = new Set(list.map(m => m.date)).size;
  const add = (v, l) => { const d = el("div", "", l); d.prepend(el("b", "", v)); ps.appendChild(d); };
  add(total, "total kcal");
  if (period !== "day") { add(Math.round(total / dayCount), "avg per logged day"); add(dayCount + "/" + days, "days logged"); }
}

function renderSlots(fid) {
  const box = $("#slotEditor"); box.innerHTML = "";
  byTime().forEach(s => {
    const row = el("div", "slotrow"), t = el("div", "tbox"), mb = el("div", "mbox pl");
    const n = el("input"), tm = el("input"), p = el("input"), x = el("button", "ghost", "Remove");
    n.type = "text"; n.value = s.name; n.setAttribute("aria-label", "Meal name");
    tm.type = "time"; tm.value = s.time; tm.setAttribute("aria-label", "Meal time");
    p.type = "text"; p.placeholder = "Add a food, e.g. porridge"; p.setAttribute("aria-label", "Add a food to " + s.name);
    n.onchange = () => {
      const old = s.name, nu = n.value.trim() || old; n.value = nu;
      S.meals.forEach(m => { if (m.slot === old) m.slot = nu; });
      s.name = nu; p.setAttribute("aria-label", "Add a food to " + nu); save(); renderSelect(); renderDay(); renderChart();
    };
    tm.onchange = () => { s.time = tm.value || "00:00"; save(); render(); };
    const addBtn = el("button", "", "Add food");
    const addFood = () => {
      const v = p.value.trim(); if (!v) return;
      const list = foodsFor(s.id); if (!list.includes(v)) setFoods(s.id, [...list, v]);
      save(); renderSlots(s.id); renderFoodSelect(); renderDay();
    };
    addBtn.onclick = addFood;
    p.onkeydown = e => { if (e.key === "Enter") addFood(); };
    x.onclick = () => { S.slots = S.slots.filter(z => z.id !== s.id); save(); render(); };
    t.append(n, tm, x);
    if (!foodsFor(s.id).length) mb.appendChild(el("div", "none", "No foods yet"));
    foodsFor(s.id).forEach(f => {
      const fr = el("div", "food"), rm = el("button", "ghost", "✕");
      rm.setAttribute("aria-label", "Remove " + f);
      rm.onclick = () => { setFoods(s.id, foodsFor(s.id).filter(z => z !== f)); save(); renderSlots(); renderFoodSelect(); renderDay(); };
      fr.append(el("span", "", f), rm); mb.appendChild(fr);
    });
    const ar = el("div", "addfood"); ar.append(p, addBtn); mb.appendChild(ar);
    row.append(t, mb); box.appendChild(row);
    if (s.id === fid) p.focus();
  });
}

function render() { renderSelect(); renderDay(); renderChart(); renderSlots(); }

function show(v) {
  if (!VIEWS[v]) v = "planner"; view = v;
  Object.keys(VIEWS).forEach(k => {
    $("#v-" + k).hidden = k !== v;
    const b = document.querySelector(`.side button[data-v="${k}"]`);
    b.classList.toggle("on", k === v);
    if (k === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("#title").textContent = VIEWS[v];
  
  render();
}

document.querySelector(".side").onclick = e => {
  const v = e.target.dataset.v; if (!v) return;
  show(v); try { if (location.hash !== "#" + v) location.hash = v; } catch (err) {}
};
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== view) show(v); });

$("#add").onclick = () => {
  const fv = $("#mFood").value, name = fv === "__other" ? $("#mName").value.trim() : fv, kcal = Math.round(+$("#mKcal").value), slot = $("#mSlot").value;
  if (!name || !slot) { ($("#mName").hidden ? $("#mFood") : $("#mName")).focus(); return; }
  if ($("#mKcal").value === "" || !(kcal >= 0)) { $("#mKcal").focus(); return; }
  S.meals.push({ id: S.nid++, date, slot, name, kcal });
  $("#mName").value = ""; $("#mKcal").value = ""; save(); render(); ($("#mName").hidden ? $("#mKcal") : $("#mName")).focus();
};
["#mName", "#mKcal"].forEach(s => $(s).addEventListener("keydown", e => { if (e.key === "Enter") $("#add").click(); }));
$("#mSlot").onchange = renderFoodSelect;
$("#mFood").onchange = () => { $("#mName").hidden = $("#mFood").value !== "__other"; if (!$("#mName").hidden) $("#mName").focus(); };
$("#goal").onchange = e => { S.goal = Math.max(0, +e.target.value || 0); save(); render(); };
$("#addSlot").onclick = () => { S.slots.push({ id: S.nid++, name: "New meal", time: "10:00" }); save(); render(); };
$("#date").onchange = e => { if (e.target.value) { date = e.target.value; render(); } };
const shift = n => { const d = parse(date); d.setDate(d.getDate() + n); date = iso(d); render(); };
$("#prev").onclick = () => shift(-1); $("#next").onclick = () => shift(1);
$("#today").onclick = () => { date = iso(new Date()); render(); };
$("#tabs").onclick = e => {
  const p = e.target.dataset.p; if (!p) return; period = p;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === p)); renderChart();
};
show(location.hash.slice(1));
</script>
</body>
</html>
